<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Invite 💘</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background:
        linear-gradient(rgba(255,182,193,0.6), rgba(255,182,193,0.6)),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee");
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Comic Sans MS', cursive;
      overflow: hidden;
    }

    .butterfly {
      position: absolute;
      font-size: 22px;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-25px); }
      100% { transform: translateY(0); }
    }

    .card {
      background: #fff0f5;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255,105,180,0.5);
      max-width: 350px;
      position: relative;
    }

    .cupid {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      color: #ff4d6d;
      font-size: 24px;
    }

    button {
      padding: 12px 22px;
      margin: 10px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }

    .yes {
      background-color: #ff4d6d;
      color: white;
    }

    .no {
      background-color: #e0e0e0;
    }
  </style>
</head>

<body>

  <!-- Butterflies -->
  <div class="butterfly" style="top:10%; left:20%">🦋</div>
  <div class="butterfly" style="top:30%; left:80%">🦋</div>
  <div class="butterfly" style="top:70%; left:15%">🦋</div>
  <div class="butterfly" style="top:65%; left:75%">🦋</div>

  <!-- Valentine Card -->
  <div class="card">
    <div class="cupid">💘</div>
    <h1>madhu,<br>Will you be my Valentine?</h1>

    <button class="yes" onclick="yesClick()">Yes</button>
    <button class="no" onclick="alert('No is not allowed 😌')">No</button>
  </div>

  <script>
    function yesClick() {
      document.body.innerHTML =
        "<h1 style='color:#ff4d6d;text-align:center;'>I knew it 💖<br>You are my forever ✨</h1>";
    }
  </script>

</body>
</html>
