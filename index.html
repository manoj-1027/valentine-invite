<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Invite 💘</title>

  <style>
    body {
      margin: 0;
      height: 100vh;

      /* EXACT Northern Lights image from your repo */
      background:
        linear-gradient(rgba(255,192,203,0.30), rgba(255,192,203,0.30)),
        url("northern-lights.jpg.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: 'Comic Sans MS', cursive;
      overflow: hidden;
    }

    /* Butterflies */
    .butterfly {
      position: absolute;
      font-size: 22px;
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-25px); }
      100% { transform: translateY(0); }
    }

    /* Valentine card */
    .card {
      background: #fff0f5;
      padding: 32px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255,105,180,0.55);
      max-width: 360px;
      position: relative;
      z-index: 10;
    }

    .cupid {
      font-size: 56px;
      margin-bottom: 12px;
    }

    h1 {
      color: #ff4d6d;
      font-size: 24px;
      line-height: 1.4;
    }

    button {
      padding: 12px 24px;
      margin: 12px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }

    .yes {
      background-color: #ff4d6d;
      color: white;
    }

    /* NO button is movable */
    .no {
      background-color: #e0e0e0;
      position: absolute;
    }
  </style>
</head>

<body>

  <!-- Floating butterflies -->
  <div class="butterfly" style="top:12%; left:18%">🦋</div>
  <div class="butterfly" style="top:28%; left:80%">🦋</div>
  <div class="butterfly" style="top:70%; left:20%">🦋</div>
  <div class="butterfly" style="top:65%; left:75%">🦋</div>
  <div class="butterfly" style="top:40%; left:50%">🦋</div>

  <!-- Valentine Card -->
  <div class="card">
    <div class="cupid">💘</div>

    <h1>
      Madhu,<br>
      Will you be my Valentine?
    </h1>

    <button class="yes" onclick="yesClick()">Yes</button>
    <button class="no" id="noBtn">No</button>
  </div>

  <script>
    /* YES click */
    function yesClick() {
      document.body.innerHTML =
        "<h1 style='color:#ff4d6d;text-align:center;'>I knew it 💖<br>You are my forever ✨</h1>";
    }

    /* NO button escape logic */
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseover", () => {
      const padding = 40;

      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });
  </script>

</body>
</html>
