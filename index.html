<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Invite 💘</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      height: 100vh;
      background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 50%, #ffd4e8 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      position: relative;
    }
    
    /* Floating hearts background */
    .heart-bg {
      position: absolute;
      font-size: 30px;
      animation: floatHeart 8s ease-in-out infinite;
      pointer-events: none;
      opacity: 0.3;
    }
    
    @keyframes floatHeart {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(10deg); }
    }
    
    /* Butterflies */
    .butterfly {
      position: absolute;
      font-size: 24px;
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(10px, -15px) rotate(5deg); }
      50% { transform: translate(-5px, -25px) rotate(-5deg); }
      75% { transform: translate(15px, -10px) rotate(3deg); }
    }
    
    /* Card Container */
    .card {
      background: linear-gradient(to bottom, #fff5f9, #ffffff);
      padding: 40px 50px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(255, 105, 180, 0.4);
      width: 420px;
      min-height: 480px;
      position: relative;
      border: 3px solid rgba(255, 182, 193, 0.5);
    }
    
    /* Character Image */
    .character-img {
      width: 150px;
      height: 150px;
      margin: 0 auto 20px;
      animation: bounce 2s ease-in-out infinite;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    h1 {
      color: #ff1744;
      font-size: 28px;
      line-height: 1.5;
      margin-bottom: 30px;
      font-weight: bold;
    }
    
    .name {
      color: #ff4081;
      font-size: 32px;
      display: block;
      margin-bottom: 10px;
    }
    
    /* Button Container */
    .button-container {
      position: relative;
      height: 80px;
      margin-top: 20px;
    }
    
    button {
      padding: 14px 40px;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    
    button:active {
      transform: scale(0.95);
    }
    
    .yes {
      background: linear-gradient(135deg, #ff1744 0%, #ff4081 100%);
      color: white;
      margin-right: 20px;
    }
    
    .yes:hover {
      background: linear-gradient(135deg, #ff4081 0%, #ff1744 100%);
      box-shadow: 0 6px 20px rgba(255, 23, 68, 0.4);
      transform: scale(1.05);
    }
    
    .no {
      background: linear-gradient(135deg, #e0e0e0 0%, #bdbdbd 100%);
      color: #666;
      position: absolute;
      transition: all 0.3s ease;
    }
    
    .no:hover {
      background: linear-gradient(135deg, #bdbdbd 0%, #9e9e9e 100%);
    }
    
    /* Success message */
    .success {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #ff1744;
      font-size: 48px;
      font-weight: bold;
      animation: fadeIn 1s ease-in;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .success-emoji {
      font-size: 100px;
      margin-bottom: 20px;
      animation: heartBeat 1.5s ease-in-out infinite;
    }
    
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      10%, 30% { transform: scale(1.1); }
      20%, 40% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <!-- Background decorations -->
  <div class="heart-bg" style="top:10%; left:10%">💕</div>
  <div class="heart-bg" style="top:20%; left:85%; animation-delay: 1s">💖</div>
  <div class="heart-bg" style="top:75%; left:15%; animation-delay: 2s">💗</div>
  <div class="heart-bg" style="top:80%; left:80%; animation-delay: 3s">💝</div>
  
  <div class="butterfly" style="top:15%; left:20%">🦋</div>
  <div class="butterfly" style="top:35%; left:80%; animation-delay: 1.5s">🦋</div>
  <div class="butterfly" style="top:70%; left:25%; animation-delay: 3s">🦋</div>
  <div class="butterfly" style="top:65%; left:75%; animation-delay: 2.5s">🦋</div>

  <!-- Valentine Card -->
  <div class="card" id="card">
    <!-- Teddy Bear SVG -->
    <svg class="character-img" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Left ear -->
      <circle cx="60" cy="45" r="25" fill="#d4a373"/>
      <circle cx="60" cy="45" r="15" fill="#e8c4a0"/>
      <!-- Right ear -->
      <circle cx="140" cy="45" r="25" fill="#d4a373"/>
      <circle cx="140" cy="45" r="15" fill="#e8c4a0"/>
      <!-- Head -->
      <circle cx="100" cy="90" r="55" fill="#d4a373"/>
      <!-- Snout -->
      <ellipse cx="100" cy="105" rx="30" ry="25" fill="#e8c4a0"/>
      <!-- Eyes -->
      <circle cx="85" cy="85" r="5" fill="#000"/>
      <circle cx="115" cy="85" r="5" fill="#000"/>
      <!-- Nose -->
      <ellipse cx="100" cy="105" rx="8" ry="6" fill="#8b4513"/>
      <!-- Smile -->
      <path d="M 90 110 Q 100 118 110 110" stroke="#8b4513" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Body -->
      <ellipse cx="100" cy="160" rx="45" ry="40" fill="#d4a373"/>
      <!-- Arms -->
      <ellipse cx="65" cy="150" rx="15" ry="30" fill="#d4a373"/>
      <ellipse cx="135" cy="150" rx="15" ry="30" fill="#d4a373"/>
      <!-- Heart -->
      <g transform="translate(100, 155)">
        <path d="M 0,-8 C -10,-18 -20,-8 -10,2 L 0,12 L 10,2 C 20,-8 10,-18 0,-8 Z" fill="#ff69b4"/>
      </g>
      <!-- Blush -->
      <circle cx="70" cy="95" r="8" fill="#ff9999" opacity="0.5"/>
      <circle cx="130" cy="95" r="8" fill="#ff9999" opacity="0.5"/>
    </svg>
    
    <h1>
      <span class="name">Madhu,</span>
      Will you be my Valentine? 💕
    </h1>
    
    <div class="button-container">
      <button class="yes" onclick="yesClick()">Yes! 💖</button>
      <button class="no" id="noBtn">No</button>
    </div>
  </div>

  <!-- Success Message -->
  <div class="success" id="successMsg">
    <div class="success-emoji">💖</div>
    <div>I knew it😚💕</div>
    <div style="font-size: 36px; margin-top: 20px;">that's y the no button is away😉</div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const card = document.getElementById("card");
    const buttonContainer = card.querySelector('.button-container');
    
    function yesClick() {
      document.getElementById('card').style.display = 'none';
      document.getElementById('successMsg').style.display = 'flex';
      
      // Create confetti effect
      createConfetti();
    }
    
    function createConfetti() {
      const colors = ['#ff1744', '#ff4081', '#ff69b4', '#ffc0cb'];
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.style.position = 'fixed';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.top = '-10px';
        confetti.style.fontSize = '20px';
        confetti.innerHTML = ['💕', '💖', '💗', '💝', '❤️'][Math.floor(Math.random() * 5)];
        confetti.style.animation = `fall ${2 + Math.random() * 3}s linear`;
        document.body.appendChild(confetti);
        
        setTimeout(() => confetti.remove(), 5000);
      }
      
      const style = document.createElement('style');
      style.innerHTML = `
        @keyframes fall {
          to {
            transform: translateY(100vh) rotate(360deg);
            opacity: 0;
          }
        }
      `;
      document.head.appendChild(style);
    }
    
    // Move "No" button away when mouse gets close
    let isMoving = false;
    
    document.addEventListener('mousemove', (e) => {
      if (isMoving) return;
      
      const btnRect = noBtn.getBoundingClientRect();
      const containerRect = buttonContainer.getBoundingClientRect();
      
      // Get mouse position
      const mouseX = e.clientX;
      const mouseY = e.clientY;
      
      // Get button center
      const btnCenterX = btnRect.left + btnRect.width / 2;
      const btnCenterY = btnRect.top + btnRect.height / 2;
      
      // Calculate distance from mouse to button
      const distance = Math.sqrt(
        Math.pow(mouseX - btnCenterX, 2) + 
        Math.pow(mouseY - btnCenterY, 2)
      );
      
      // If mouse is within 100px of the button, move it away
      if (distance < 100) {
        isMoving = true;
        
        // Calculate new position away from mouse
        const angle = Math.atan2(btnCenterY - mouseY, btnCenterX - mouseX);
        const moveDistance = 150; // Distance to move away
        
        let newX = btnRect.left - containerRect.left + Math.cos(angle) * moveDistance;
        let newY = btnRect.top - containerRect.top + Math.sin(angle) * moveDistance;
        
        // Keep button within container bounds
        const maxX = containerRect.width - btnRect.width;
        const maxY = containerRect.height - btnRect.height;
        
        newX = Math.max(0, Math.min(newX, maxX));
        newY = Math.max(0, Math.min(newY, maxY));
        
        noBtn.style.left = newX + 'px';
        noBtn.style.top = newY + 'px';
        
        setTimeout(() => {
          isMoving = false;
        }, 300);
      }
    });
    
    // Initial position for "No" button
    window.addEventListener('load', () => {
      const containerRect = buttonContainer.getBoundingClientRect();
      noBtn.style.left = (containerRect.width - noBtn.offsetWidth - 20) + 'px';
      noBtn.style.top = '0px';
    });
    
    // Also move on touch for mobile
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const containerRect = buttonContainer.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
      
      const maxX = containerRect.width - btnRect.width;
      const maxY = containerRect.height - btnRect.height;
      
      const newX = Math.random() * maxX;
      const newY = Math.random() * maxY;
      
      noBtn.style.left = newX + 'px';
      noBtn.style.top = newY + 'px';
    });
  </script>
</body>
</html>
