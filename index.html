<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Invite 💘</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background:
        linear-gradient(rgba(255,192,203,0.30), rgba(255,192,203,0.30)),
        url("northern-lights.jpg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: 'Comic Sans MS', cursive;
      overflow: hidden;
    }

    /* Butterflies */
    .butterfly {
      position: absolute;
      font-size: 20px;
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0); }
    }

    /* Card */
    .card {
      background: #fff0f5;
      padding: 30px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255,105,180,0.55);
      width: 360px;
      height: 260px;
      position: relative; /* IMPORTANT */
    }

    .cupid-img {
      width: 70px;
      margin-bottom: 8px;
    }

    h1 {
      color: #ff4d6d;
      font-size: 22px;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 22px;
      border: none;
      border-radius: 22px;
      font-size: 15px;
      cursor: pointer;
    }

    .yes {
      background-color: #ff4d6d;
      color: white;
      position: relative;
    }

    .no {
      background-color: #e0e0e0;
      position: absolute;
      right: 40px;
      bottom: 30px;
    }
  </style>
</head>

<body>

  <!-- Butterflies -->
  <div class="butterfly" style="top:15%; left:20%">🦋</div>
  <div class="butterfly" style="top:35%; left:80%">🦋</div>
  <div class="butterfly" style="top:70%; left:25%">🦋</div>
  <div class="butterfly" style="top:65%; left:75%">🦋</div>

  <!-- Valentine Card -->
  <div class="card" id="card">
    <img class="cupid-img"
         src="https://pngimg.com/uploads/cupid/cupid_PNG35.png"
         alt="Cupid">

    <h1>
      Madhu,<br>
      Will you be my Valentine?
    </h1>

    <button class="yes" onclick="yesClick()">Yes</button>
    <button class="no" id="noBtn">No</button>
  </div>

  <script>
    function yesClick() {
      document.body.innerHTML =
        "<h1 style='color:#ff4d6d;text-align:center;'>I knew it😚<br>that's y the no button is away😉</h1>";
    }

    const noBtn = document.getElementById("noBtn");
    const card = document.getElementById("card");

    noBtn.addEventListener("mouseenter", () => {
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const padding = 20;

      const maxX = card.clientWidth - btnRect.width - padding;
      const maxY = card.clientHeight - btnRect.height - padding;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });
  </script>

</body>
</html>
